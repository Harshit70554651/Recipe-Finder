<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="recipe.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>
    <div id="upper-container">
        <h2> <span><i class="fa-solid fa-utensils"></i></span>Recipe Finder</h2>
        <p style=" color: white; font-size: 13px; font-weight: 400; letter-spacing: 0.45px;">Find something Good to cook
        </p>

        <div class="input"><input type="text" placeholder="Try pasta, chicken e.g"><i
                class="fa-solid fa-magnifying-glass search"></i></div>

        <div class="category"><span>All</span>
            <span>Indian</span>
            <span>Italian</span>
            <span>Mexican</span>
        </div>
    </div>
    <div class="extra">
        <h4>Recipe Found</h4>
        <p><i class="fa-regular fa-heart"></i>Saved</p>
    </div>
<div class="recipe-container">
    </div>


    
    <div class="overlay" id="overlay">
        <div class="modal" id="modal"></div>
    </div>
    




    <script src="recipe.js"></script>

</body>

</html>
